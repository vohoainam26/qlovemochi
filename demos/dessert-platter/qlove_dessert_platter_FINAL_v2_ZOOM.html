<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Explore the QLove Dessert Platter: three dessert-inspired mochi flavours in one interactive collection.">
<title>QLove — Dessert Platter 3D</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<style>
  *{box-sizing:border-box}

  /* =========================================================
     QLOVE — DESSERT PLATTER
     Production section. All styles are scoped to this section.
     ========================================================= */
  #qlove-dessert-platter{
    --qdp-bg:#f5efec;
    --qdp-ink:#30282b;
    --qdp-muted:#8f7779;
    --qdp-accent:#d85f78;
    --qdp-card:rgba(255,255,255,.64);
    position:relative;
    width:100%;
    min-height:clamp(760px,100svh,980px);
    overflow:hidden;
    isolation:isolate;

    color:var(--qdp-ink);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  #qlove-dessert-platter::before{display:none;}

  #qlove-dessert-platter::after{display:none;}

  #qlove-dessert-platter .qdp-copy{
    position:absolute;
    z-index:8;
    top:clamp(28px,5vh,58px);
    left:50%;
    transform:translateX(-50%);
    width:min(94%,1500px);
    text-align:center;
    pointer-events:none;
  }

  #qlove-dessert-platter .qdp-eyebrow{
    margin:0 0 12px;
    color:#aa6965;
    font-size:clamp(10px,.8vw,13px);
    font-weight:900;
    line-height:1;
    letter-spacing:.2em;
    text-transform:uppercase;
  }

  #qlove-dessert-platter .qdp-title{
    margin:0;
    color:var(--qdp-ink);
    font-size:clamp(64px,9.2vw,158px);
    font-weight:1000;
    line-height:.77;
    letter-spacing:-.078em;
    white-space:nowrap;
  }

  #qlove-dessert-platter .qdp-subtitle{
    max-width:620px;
    margin:23px auto 0;
    color:rgba(48,40,43,.66);
    font-size:clamp(14px,1.1vw,18px);
    line-height:1.45;
  }

  #qlove-dessert-platter .qdp-weight{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:13px;
    min-height:30px;
    padding:0 15px;
    border:1px solid rgba(159,104,111,.17);
    border-radius:999px;
    background:rgba(255,255,255,.68);
    box-shadow:0 8px 25px rgba(62,37,44,.055);
    color:#a65f5b;
    font-size:10px;
    font-weight:900;
    letter-spacing:.2em;
    backdrop-filter:blur(10px);
  }

  #qlove-dessert-platter .qdp-stage{
    position:absolute;
    z-index:2;
    left:0;
    right:0;
    top:15%;
    bottom:8%;
  }

  #qlove-dessert-platter .qdp-stage canvas{
    display:block;
    width:100%;
    height:100%;
    outline:0;
    cursor:grab;
  }

  #qlove-dessert-platter .qdp-stage canvas:active{cursor:grabbing}

  #qlove-dessert-platter .qdp-drag-hint{
    position:absolute;
    z-index:7;
    left:clamp(24px,4.7vw,74px);
    top:55%;
    display:flex;
    align-items:center;
    gap:11px;
    color:rgba(48,40,43,.44);
    font-size:10px;
    font-weight:900;
    line-height:1;
    letter-spacing:.15em;
    text-transform:uppercase;
    pointer-events:none;
  }

  #qlove-dessert-platter .qdp-drag-icon{
    position:relative;
    width:42px;
    height:42px;
    border:1px solid rgba(48,40,43,.18);
    border-radius:50%;
  }

  #qlove-dessert-platter .qdp-drag-icon::before,
  #qlove-dessert-platter .qdp-drag-icon::after{
    content:"";
    position:absolute;
    top:50%;
    width:7px;
    height:7px;
    border-left:1.5px solid currentColor;
    border-top:1.5px solid currentColor;
  }

  #qlove-dessert-platter .qdp-drag-icon::before{
    left:9px;
    transform:translateY(-50%) rotate(-45deg);
  }

  #qlove-dessert-platter .qdp-drag-icon::after{
    right:9px;
    transform:translateY(-50%) rotate(135deg);
  }

  #qlove-dessert-platter .qdp-flavours{
    position:absolute;
    z-index:9;
    left:50%;
    bottom:clamp(20px,3.3vh,36px);
    transform:translateX(-50%);
    width:min(92%,1050px);
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }

  #qlove-dessert-platter .qdp-flavour{
    appearance:none;
    position:relative;
    border:1px solid rgba(80,54,61,.09);
    border-radius:19px;
    padding:13px 15px 12px;
    background:var(--qdp-card);
    color:var(--qdp-ink);
    box-shadow:0 12px 34px rgba(66,42,47,.065);
    backdrop-filter:blur(15px);
    text-align:left;
    cursor:pointer;
    transition:
      transform .25s ease,
      background .25s ease,
      border-color .25s ease,
      box-shadow .25s ease;
  }

  #qlove-dessert-platter .qdp-flavour:hover,
  #qlove-dessert-platter .qdp-flavour.is-active{
    transform:translateY(-5px);
    background:rgba(255,255,255,.9);
    border-color:var(--flavour);
    box-shadow:0 18px 42px rgba(66,42,47,.105);
  }

  #qlove-dessert-platter .qdp-flavour-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  #qlove-dessert-platter .qdp-flavour-name{
    font-size:clamp(12px,.95vw,15px);
    font-weight:900;
    line-height:1.1;
    letter-spacing:-.015em;
  }

  #qlove-dessert-platter .qdp-dot{
    width:9px;
    height:9px;
    flex:0 0 auto;
    border-radius:50%;
    background:var(--flavour);
    box-shadow:0 0 0 5px color-mix(in srgb,var(--flavour) 15%,transparent);
  }

  #qlove-dessert-platter .qdp-flavour-copy{
    display:block;
    margin-top:7px;
    color:rgba(48,40,43,.5);
    font-size:10.5px;
    line-height:1.35;
  }

  #qlove-dessert-platter .qdp-loader{
    position:absolute;
    inset:0;
    z-index:20;
    display:grid;
    place-items:center;
    background:
      radial-gradient(circle at 50% 45%,#fff 0%,rgba(255,255,255,.92) 28%,rgba(245,239,236,.96) 70%);
    transition:opacity .45s ease,visibility .45s ease;
  }

  #qlove-dessert-platter .qdp-loader.is-hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  #qlove-dessert-platter .qdp-spinner{
    width:42px;
    height:42px;
    border-radius:50%;
    border:3px solid rgba(216,95,120,.12);
    border-top-color:var(--qdp-accent);
    animation:qdp-spin .8s linear infinite;
  }

  #qlove-dessert-platter .qdp-fallback{
    display:none;
    max-width:420px;
    padding:20px;
    text-align:center;
    color:rgba(48,40,43,.62);
    font-size:13px;
    line-height:1.5;
  }

  @keyframes qdp-spin{to{transform:rotate(360deg)}}

  @media(max-width:900px){
    #qlove-dessert-platter{
      min-height:760px;
    }
    #qlove-dessert-platter .qdp-copy{
      top:30px;
    }
    #qlove-dessert-platter .qdp-title{
      font-size:clamp(58px,13.2vw,92px);
      white-space:normal;
    }
    #qlove-dessert-platter .qdp-subtitle{
      margin-top:15px;
    }
    #qlove-dessert-platter .qdp-stage{
      top:18%;
      bottom:14%;
    }
    #qlove-dessert-platter .qdp-drag-hint{
      display:none;
    }
    #qlove-dessert-platter .qdp-flavours{
      bottom:14px;
      width:calc(100% - 24px);
      gap:6px;
    }
    #qlove-dessert-platter .qdp-flavour{
      min-height:48px;
      padding:10px 10px;
      border-radius:14px;
      text-align:center;
    }
    #qlove-dessert-platter .qdp-flavour-top{
      justify-content:center;
    }
    #qlove-dessert-platter .qdp-dot,
    #qlove-dessert-platter .qdp-flavour-copy{
      display:none;
    }
  }

  @media(max-width:560px){
    #qlove-dessert-platter{
      min-height:690px;
    }
    #qlove-dessert-platter .qdp-title{
      font-size:clamp(52px,14.5vw,74px);
    }
    #qlove-dessert-platter .qdp-stage{
      top:22%;
      bottom:15%;
    }
    #qlove-dessert-platter .qdp-flavour-name{
      font-size:10px;
    }
  }

  @media(prefers-reduced-motion:reduce){
    #qlove-dessert-platter .qdp-flavour{
      transition:none;
    }
  }

  /* Standalone preview only. Safe to remove when pasting the section into index.html. */
  body{margin:0; background:transparent;}
.custom-bg{
    position:fixed;
    inset:0;
    z-index:1;
    background-image:url("/assets/optimized/dessert-platter/scene-bg.jpg?v=20261011-perf1");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
  }

  .bg-soft-overlay{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
      radial-gradient(circle at 50% 52%, rgba(255,255,255,.03), rgba(255,255,255,0) 36%),
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0) 32%);
  }

  .petals-layer {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }

  .petal {
    position: absolute;
    top: -8vh;
    left: 0;
    width: 22px;
    height: 16px;
    opacity: 0;
    border-radius: 72% 28% 78% 22%;
    background:
      radial-gradient(circle at 35% 35%, rgba(255,255,255,.78) 0%, rgba(255,255,255,.18) 18%, rgba(255,255,255,0) 35%),
      linear-gradient(135deg, #f9c1d5 0%, #f5a8c2 55%, #f2bed2 100%);
    box-shadow:
      inset 0 0 1px rgba(255,255,255,.65),
      0 5px 10px rgba(219,135,168,.10);
    filter: blur(.15px);
    will-change: transform, opacity;
    animation-name: fallPetal;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .petal::after {
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,0) 55%);
    mix-blend-mode: screen;
  }

  @keyframes fallPetal {
    0% {
      opacity: 0;
      transform: translate3d(0,0,0) rotate(0deg) scale(var(--scale));
    }
    8% {
      opacity: var(--opacity);
    }
    88% {
      opacity: calc(var(--opacity) * .92);
    }
    100% {
      opacity: 0;
      transform:
        translate3d(var(--driftX), 118vh, 0)
        rotate(var(--rotEnd))
        scale(var(--scale));
    }
  }

  #stage{position:fixed; inset:0; z-index:4}
  canvas{display:block; width:100%; height:100%}

  .topbar{
    position:fixed; left:24px; right:24px; top:22px; z-index:6;
    display:flex; justify-content:space-between; gap:16px; align-items:center;
    pointer-events:none;
  }
  .brand{
    pointer-events:auto;
    background:rgba(255,255,255,.58);
    border:1px solid rgba(255,255,255,.78);
    backdrop-filter:blur(14px);
    border-radius:18px;
    padding:14px 16px;
    box-shadow:0 12px 40px rgba(49,36,44,.08);
  }
  .brand small{display:block; font-size:11px; letter-spacing:.18em; font-weight:760; opacity:.54; margin-bottom:4px}
  .brand strong{font-size:16px; letter-spacing:-.02em}
  .controls{pointer-events:auto; display:flex; gap:8px}
  button{
    appearance:none; border:0; cursor:pointer; border-radius:999px;
    padding:11px 15px; font:inherit; font-size:12px; font-weight:700;
    color:#433940; background:rgba(255,255,255,.72);
    border:1px solid rgba(255,255,255,.90); backdrop-filter:blur(12px);
    box-shadow:0 10px 30px rgba(49,36,44,.08);
  }
  button:hover{background:#fff}
  button.active{color:#fff; background:var(--pink); border-color:var(--pink)}

  .hint{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    white-space:nowrap; font-size:11px; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; color:rgba(38,32,36,.45);
    background:rgba(255,255,255,.56); border:1px solid rgba(255,255,255,.78);
    backdrop-filter:blur(10px); padding:10px 14px; border-radius:999px;
    pointer-events:none; z-index:6;
  }

  .loading{
    position:fixed; inset:0; z-index:20; display:grid; place-items:center;
    background:linear-gradient(135deg,#f7f3f4,#ece9eb); transition:opacity .45s ease;
  }
  .loading.hide{opacity:0; pointer-events:none}
  .loader{
    width:42px; height:42px; border-radius:50%;
    border:3px solid rgba(217,20,85,.12); border-top-color:var(--pink);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  @media(max-width:700px){
    .topbar{left:12px; right:12px; top:12px; align-items:flex-start}
    .brand{padding:11px 12px}
    .brand strong{font-size:13px}
    .controls{flex-direction:column}
    button{padding:9px 12px}
    .hint{bottom:14px; font-size:9px}
  }
</style>

<script>
  /* If the Three.js module cannot start, never leave the website stuck behind a loader. */
  window.__qdpFallbackTimer = setTimeout(() => {
    const loader = document.querySelector("#qdp-loader");
    const spinner = document.querySelector("#qdp-loader .qdp-spinner");
    const fallback = document.querySelector("#qdp-fallback");
    if(loader && !loader.classList.contains("is-hidden")){
      if(spinner) spinner.style.display = "none";
      if(fallback) fallback.style.display = "block";
    }
  }, 6500);
</script>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const section = document.querySelector("#qlove-dessert-platter");
const stage = section?.querySelector("#qdp-stage");
const loader = section?.querySelector("#qdp-loader");
const fallback = section?.querySelector("#qdp-fallback");

if(!section || !stage) {
  throw new Error("QLove Dessert Platter section/stage not found.");
}

const scene = new THREE.Scene();

const petalsLayer = document.querySelector("#petalsLayer");

// Create subtle floating sakura petals
function createPetals(count = 20) {
  for (let i = 0; i < count; i++) {
    const petal = document.createElement("div");
    petal.className = "petal";

    const size = 12 + Math.random() * 18;
    const startX = Math.random() * 100;
    const duration = 12 + Math.random() * 12;
    const delay = -Math.random() * duration;
    const driftX = (Math.random() * 260 - 130).toFixed(1) + "px";
    const rotEnd = (180 + Math.random() * 320).toFixed(0) + "deg";
    const scale = (0.75 + Math.random() * 0.85).toFixed(2);
    const opacity = (0.35 + Math.random() * 0.35).toFixed(2);

    petal.style.left = startX + "vw";
    petal.style.width = size + "px";
    petal.style.height = (size * 0.72) + "px";
    petal.style.animationDuration = duration + "s";
    petal.style.animationDelay = delay + "s";
    petal.style.setProperty("--driftX", driftX);
    petal.style.setProperty("--rotEnd", rotEnd);
    petal.style.setProperty("--scale", scale);
    petal.style.setProperty("--opacity", opacity);
    petal.style.filter = `blur(${(Math.random() * 1.2).toFixed(2)}px)`;

    petalsLayer.appendChild(petal);
  }
}
createPetals(22);

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(3.95, 2.2, 4.9);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});
/* A 1.5× cap keeps the 3D product crisp while avoiding a costly 4× pixel
   workload on high-density mobile screens. */
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.shadowMap.enabled = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.72;
stage.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.enablePan = false;

/* Wheel zoom is handled with a product raycast below so the page remains scrollable. */
controls.enableZoom = false;
controls.minPolarAngle = Math.PI * .25;
controls.maxPolarAngle = Math.PI * .72;
controls.target.set(0, 0.02, 0);

/* On touch devices keep page scrolling natural; desktop keeps drag + wheel zoom. */
if(matchMedia("(pointer:coarse)").matches){
  controls.enableRotate = false;
  controls.enableZoom = false;
}

/* Original v3 dimmer-front lighting preserved. */
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b0b5, 0.72));

const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(-4.5,6,5.5);
scene.add(key);

const fill = new THREE.DirectionalLight(0xffedf3, 0.48);
fill.position.set(5,2.8,4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xe3ebff, 0.34);
rim.position.set(2.5,5,-5);
scene.add(rim);

const dielineSrc = "/assets/optimized/dessert-platter/dieline.jpg?v=20261011-perf1";

function createCanvas(w,h){
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  return c;
}

function applySharpen(canvas, amount = 0.9){
  const ctx = canvas.getContext("2d");
  const src = ctx.getImageData(0,0,canvas.width,canvas.height);
  const dst = ctx.createImageData(canvas.width,canvas.height);

  const w = src.width;
  const h = src.height;
  const s = src.data;
  const d = dst.data;

  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      for(let c=0;c<4;c++){
        const i = (y*w+x)*4+c;
        if(c===3){
          d[i] = s[i];
          continue;
        }
        const center = s[i]*(1+4*amount);
        const top = s[((y-1)*w+x)*4+c]*amount;
        const left = s[(y*w+(x-1))*4+c]*amount;
        const right = s[(y*w+(x+1))*4+c]*amount;
        const bottom = s[((y+1)*w+x)*4+c]*amount;
        d[i] = Math.max(0,Math.min(255,center-top-left-right-bottom));
      }
    }
  }

  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      if(x===0 || y===0 || x===w-1 || y===h-1){
        const i=(y*w+x)*4;
        d[i]=s[i];
        d[i+1]=s[i+1];
        d[i+2]=s[i+2];
        d[i+3]=s[i+3];
      }
    }
  }

  for(let i=0;i<d.length;i+=4){
    d[i]=Math.max(0,Math.min(255,s[i]*.62+d[i]*.38));
    d[i+1]=Math.max(0,Math.min(255,s[i+1]*.62+d[i+1]*.38));
    d[i+2]=Math.max(0,Math.min(255,s[i+2]*.62+d[i+2]*.38));
    d[i+3]=s[i+3];
  }

  ctx.putImageData(dst,0,0);
}

function cropTexture(img,x,y,w,h,options={}){
  const {
    rotate=0,
    flipX=false,
    flipY=false,
    upscale=1,
    filter="",
    sharpen=false
  } = options;

  const swap = Math.abs(rotate)%180===90;
  const outW = (swap?h:w)*upscale;
  const outH = (swap?w:h)*upscale;

  const canvas = createCanvas(outW,outH);
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  if(filter) ctx.filter = filter;

  ctx.save();
  ctx.translate(canvas.width/2,canvas.height/2);
  ctx.rotate(THREE.MathUtils.degToRad(rotate));
  ctx.scale((flipX?-1:1)*upscale,(flipY?-1:1)*upscale);
  ctx.drawImage(img,x,y,w,h,-w/2,-h/2,w,h);
  ctx.restore();

  if(sharpen) applySharpen(canvas,.85);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(16,renderer.capabilities.getMaxAnisotropy());
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.needsUpdate = true;
  return tex;
}

function boxMat(tex,front=false){
  return new THREE.MeshStandardMaterial({
    map:tex,
    color:0xffffff,
    roughness:front?.78:.62,
    metalness:0,
    envMapIntensity:front?.06:.12
  });
}

const img = new Image();

let product = null;
let autoRotate = !matchMedia("(prefers-reduced-motion: reduce)").matches;
let resumeAt = 0;
let sectionVisible = true;

img.onload = () => {
  const front = cropTexture(img,230,1107,1082,673,{
    upscale:1,
    filter:"contrast(1.05) saturate(1.03) brightness(1.08)"
  });

  const back = cropTexture(img,230,263,1082,682,{
    rotate:180,
    upscale:1,
    filter:"contrast(1.02) saturate(1.02) brightness(0.94)"
  });

  const left = cropTexture(img,80,1112,148,666,{
    upscale:1,
    filter:"contrast(1.03) saturate(1.03) brightness(0.92)"
  });

  const right = cropTexture(img,1314,1112,148,666,{
    rotate:180,
    upscale:1,
    filter:"contrast(1.03) saturate(1.03) brightness(0.92)"
  });

  const top = cropTexture(img,230,950,1082,155,{
    rotate:180,
    upscale:1,
    filter:"contrast(1.02) saturate(1.02) brightness(0.93)"
  });

  const bottom = cropTexture(img,230,1784,1082,156,{
    upscale:1,
    filter:"brightness(0.92)"
  });

  const materials = [
    boxMat(right,false),
    boxMat(left,false),
    boxMat(top,false),
    boxMat(bottom,false),
    boxMat(front,true),
    boxMat(back,false)
  ];

  const geometry = new RoundedBoxGeometry(2.52,1.60,.35,6,.022);

  product = new THREE.Mesh(geometry,materials);
  product.castShadow = false;
  product.receiveShadow = false;
  product.position.y = -.16;
  product.rotation.set(
    THREE.MathUtils.degToRad(-1.9),
    THREE.MathUtils.degToRad(-11.2),
    THREE.MathUtils.degToRad(.2)
  );
  scene.add(product);

  if(window.__qdpFallbackTimer) clearTimeout(window.__qdpFallbackTimer);
  loader?.classList.add("is-hidden");

  setTimeout(() => loader?.remove(),520);
};

img.onerror = () => {
  if(window.__qdpFallbackTimer) clearTimeout(window.__qdpFallbackTimer);
  const spinner = loader?.querySelector(".qdp-spinner");
  if(spinner) spinner.style.display = "none";
  if(fallback) fallback.style.display = "block";
};

img.src = dielineSrc;

function pauseAutoRotate(){
  autoRotate = false;
  resumeAt = performance.now()+4200;
}

renderer.domElement.addEventListener("pointerdown",pauseAutoRotate);

// ======================================================
// ZOOM CHỈ KHI CON TRỎ NẰM TRÊN SẢN PHẨM 3D
// ======================================================

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let pointerOnProduct = false;

function checkPointerOnProduct(event) {
  if (!product) {
    pointerOnProduct = false;
    return false;
  }

  const rect = renderer.domElement.getBoundingClientRect();

  mouse.x =
    ((event.clientX - rect.left) / rect.width) * 2 - 1;

  mouse.y =
    -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObject(product, true);

  pointerOnProduct = hits.length > 0;

  renderer.domElement.style.cursor =
    pointerOnProduct ? "grab" : "default";

  return pointerOnProduct;
}

renderer.domElement.addEventListener(
  "pointermove",
  checkPointerOnProduct
);

renderer.domElement.addEventListener(
  "pointerleave",
  () => {
    pointerOnProduct = false;
    renderer.domElement.style.cursor = "default";
  }
);

renderer.domElement.addEventListener(
  "wheel",
  (event) => {

    // Nếu chuột KHÔNG ở trên sản phẩm:
    // không chặn wheel -> trang tiếp tục scroll bình thường
    if (!checkPointerOnProduct(event)) {
      return;
    }

    // Chuột đang ở trên sản phẩm -> chặn scroll page
    event.preventDefault();

    pauseAutoRotate();

    const direction = new THREE.Vector3()
      .subVectors(camera.position, controls.target)
      .normalize();

    const currentDistance =
      camera.position.distanceTo(controls.target);

    const zoomAmount = event.deltaY * 0.0018;

    const newDistance = THREE.MathUtils.clamp(
      currentDistance + zoomAmount,
      3.8,
      6.3
    );

    camera.position.copy(
      controls.target.clone().add(
        direction.multiplyScalar(newDistance)
      )
    );

    controls.update();
  },
  {
    passive: false
  }
);

/* Flavour controls subtly turn the single platter box to keep the section interactive,
   without pretending these are separate products. */
const flavourAngles = [
  THREE.MathUtils.degToRad(-24),
  THREE.MathUtils.degToRad(-8),
  THREE.MathUtils.degToRad(12)
];

const flavourButtons = [...section.querySelectorAll("[data-qdp-flavour]")];

function rotateProductTo(targetY){
  if(!product) return;

  pauseAutoRotate();

  const startY = product.rotation.y;
  const startX = product.rotation.x;
  const targetX = THREE.MathUtils.degToRad(-1.9);
  const started = performance.now();
  const duration = 620;

  function tween(now){
    const t = Math.min(1,(now-started)/duration);
    const e = 1-Math.pow(1-t,3);
    product.rotation.y = startY+(targetY-startY)*e;
    product.rotation.x = startX+(targetX-startX)*e;
    if(t<1) requestAnimationFrame(tween);
  }
  requestAnimationFrame(tween);
}

flavourButtons.forEach((button) => {
  button.addEventListener("click",() => {
    const index = Number(button.dataset.qdpFlavour);
    flavourButtons.forEach((b) => b.classList.toggle("is-active",b===button));
    rotateProductTo(flavourAngles[index] ?? flavourAngles[1]);
  });
});

/* Render only while this section is on/near screen. */
const visibilityObserver = new IntersectionObserver(([entry]) => {
  sectionVisible = entry.isIntersecting;
},{rootMargin:"250px 0px 250px 0px"});

visibilityObserver.observe(section);

function resizeRenderer(){
  const w = Math.max(1,stage.clientWidth);
  const h = Math.max(1,stage.clientHeight);

  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);

  if(w < 600){
    camera.position.set(4.45,2.42,5.65);
    controls.target.set(0,-.08,0);
  } else if(w < 960){
    camera.position.set(4.15,2.3,5.2);
    controls.target.set(0,-.04,0);
  } else {
    camera.position.set(3.95,2.2,4.9);
    controls.target.set(0,.02,0);
  }
  controls.update();
}

const resizeObserver = new ResizeObserver(resizeRenderer);
resizeObserver.observe(stage);
resizeRenderer();

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  if(!sectionVisible) {
    clock.getDelta();
    return;
  }

  const dt = Math.min(clock.getDelta(),.033);

  if(!autoRotate && resumeAt && performance.now()>resumeAt){
    autoRotate = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    resumeAt = 0;
  }

  if(product && autoRotate){
    product.rotation.y += dt*.082;
  }

  controls.update();
  renderer.render(scene,camera);
}

animate();
</script>
