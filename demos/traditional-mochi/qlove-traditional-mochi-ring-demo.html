<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="QLove Traditional Mochi: the original seven flavours">
<title>QLove Traditional Mochi — The Original Seven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap">
<style>
@property --accent { syntax: '<color>'; inherits: true; initial-value: #A8C95E; }
:root { --ink: #211d1a; --paper: #f8f4ee; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: Poppins, Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* 7 stops, each one holds before moving on: ~5 screens of scrolling */
.traditional { position: relative; height: 520vh; }
.stage {
  position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  --accent: #A8C95E; transition: --accent .6s ease;
  background-color: color-mix(in srgb, var(--accent) 16%, #f8f4ee);
}
.stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 52% 46% at 50% 52%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%); pointer-events: none; }
.paper { position: absolute; inset: 0; background: var(--paper-img, var(--paper)) center / cover no-repeat; opacity: .35; mix-blend-mode: multiply; pointer-events: none; }
.stage { --paper-img: var(--paper); }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E"); }

.headline { position: relative; z-index: 8; padding-top: clamp(14px, 3.4vh, 34px); text-align: center; }
.kicker, .num, .guide { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.kicker { color: #7d746c; }
.headline h1 { margin: 6px 0 0; font-size: clamp(30px, 5.2vw, 70px); font-weight: 800; line-height: .92; letter-spacing: -.05em; text-transform: uppercase; }
.guide { display: inline-block; margin-top: 10px; padding: 6px 12px; border: 1px solid rgba(33,29,26,.16); border-radius: 99px; background: rgba(255,255,255,.55); color: #6f675f; font-size: 9px; transition: opacity .5s ease; }
.stage.is-started .guide { opacity: 0; }

/* Ring */
.ring { position: relative; min-height: 0; }
.rail { position: absolute; left: 0; top: 46%; display: flex; gap: .35em; white-space: nowrap; font-size: clamp(64px, 15vw, 210px); font-weight: 800; line-height: .8; letter-spacing: -.06em; text-transform: uppercase; will-change: transform; pointer-events: none; user-select: none; }
.rail span { color: rgba(255,255,255,.75); }
.rail span.on { color: color-mix(in srgb, var(--accent) 38%, #fff); }
.products { position: absolute; inset: 0; }
.product {
  position: absolute; left: 50%; top: 54%;
  width: min(38vw, calc((100svh - 330px) * 1.3), 470px); aspect-ratio: 720 / 582;
  padding: 0; border: 0; background: transparent; cursor: pointer; --e: 0;
  will-change: transform, opacity;
}
.product img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 16px 16px rgba(33,29,26,.18)); pointer-events: none; }
.product::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -3%; height: 7%; border-radius: 50%; background: rgba(33,29,26,.28); filter: blur(12px); opacity: calc(var(--e) * .8); z-index: -1; }
.product.is-front { cursor: default; }

/* Info */
.info { position: relative; z-index: 12; padding: 4px 20px clamp(14px, 3vh, 30px); text-align: center; }
.num { color: #8c847c; }
.info h2 { margin: 4px 0 4px; font-size: clamp(30px, 4.4vw, 58px); font-weight: 800; line-height: .95; letter-spacing: -.05em; }
.info p { margin: 0; color: #575049; font-size: clamp(12px, 1.1vw, 15px); font-weight: 600; }
.dots { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
.dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 99px; background: rgba(33,29,26,.2); cursor: pointer; transition: width .35s ease, background-color .35s ease; }
.dots button:hover { background: rgba(33,29,26,.45); }
.dots button[aria-current="true"] { width: 30px; background: var(--ink); }

@media (max-width: 760px) {
  .traditional { height: 560vh; }
  .product { top: 52%; width: min(66vw, calc((100svh - 360px) * 1.3)); }
  .rail { font-size: clamp(56px, 22vw, 120px); }
  .kicker { font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .stage, .dots button, .guide { transition: none; }
}

</style>
</head>

      const a = Math.floor(clamp(f, 0, STOPS)), b = Math.min(STOPS, a + 1), t = clamp(f, 0, STOPS) - a;
      const cx = centers[a] + (centers[b] - centers[a]) * t;
      rail.style.transform = 'translate3d(' + (W / 2 - cx).toFixed(1) + 'px,-50%,0)';
    }
    const idx = clamp(Math.round(f), 0, STOPS);
    if (idx !== shown) { setInfo(idx); shown = idx; }
  }

  function frame() {
    const p = scrollProgress();
    stage.classList.toggle('is-started', p > .01);
    target = plateau(p * STOPS);
    const delta = target - cur;
    cur = reduced.matches || Math.abs(delta) < .0005 ? target : cur + delta * .14;
    render(cur);
    if (cur !== target) requestAnimationFrame(frame); else running = false;
  }
  const kick = () => { if (!running) { running = true; requestAnimationFrame(frame); } };

  addEventListener('scroll', kick, { passive: true });
  addEventListener('resize', () => { measure(); kick(); });
  addEventListener('keydown', e => {
    const r = section.getBoundingClientRect();
    if (r.top > innerHeight * .5 || r.bottom < innerHeight * .5) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); goTo(shown + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(shown - 1); }
  });

  const start = () => { measure(); cur = target = plateau(scrollProgress() * STOPS); render(cur); };
  start();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); kick(); });
})();

</script>
</body>
</html>
